<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧱 벽돌깨기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a2e;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e0e0e0;
      user-select: none;
    }
    .home-btn {
      position: fixed; top: 1rem; left: 1rem;
      padding: 0.4rem 1rem;
      border: 1.5px solid #7a8ba0; border-radius: 20px;
      color: #7a8ba0; text-decoration: none;
      font-size: 0.8rem; transition: all 0.2s;
    }
    .home-btn:hover { border-color: #ce93d8; color: #ce93d8; }

    h1 { font-size: 1.8rem; margin-bottom: 0.8rem; color: #ce93d8; letter-spacing: 3px; text-shadow: 0 0 20px #ce93d866; }

    #status-bar { display: flex; gap: 1.2rem; margin-bottom: 0.8rem; align-items: center; }
    .stat {
      display: flex; flex-direction: column; align-items: center;
      background: #16213e; border: 1px solid #0f3460;
      border-radius: 10px; padding: 0.4rem 1.1rem; min-width: 65px;
    }
    .stat-label { font-size: 0.6rem; color: #7a8ba0; letter-spacing: 2px; text-transform: uppercase; }
    .stat-value { font-size: 1.3rem; font-weight: bold; color: #ce93d8; font-variant-numeric: tabular-nums; }

    #canvas-wrap {
      padding: 10px;
      background: #16213e; border: 2px solid #0f3460;
      border-radius: 12px;
      box-shadow: 0 0 40px #ce93d822;
    }
    canvas { display: block; cursor: none; border-radius: 6px; }

    #message {
      margin-top: 0.8rem; font-size: 1rem; min-height: 1.5rem;
      letter-spacing: 1px; text-align: center;
    }
    .msg-hint { color: #7a8ba0; font-size: 0.85rem; }
    .msg-win  { color: #ce93d8; }
    .msg-over { color: #e94560; }

    .controls-hint { margin-top: 0.5rem; font-size: 0.75rem; color: #7a8ba0; }
  </style>
</head>
<body>
  <a class="home-btn" href="index.html">← 홈</a>
  <h1>🧱 벽돌깨기</h1>

  <div id="status-bar">
    <div class="stat"><span class="stat-label">점수</span><span class="stat-value" id="score">0</span></div>
    <div class="stat"><span class="stat-label">라이프</span><span class="stat-value" id="lives">❤️❤️❤️</span></div>
    <div class="stat"><span class="stat-label">스테이지</span><span class="stat-value" id="stage">1</span></div>
  </div>

  <div id="canvas-wrap">
    <canvas id="canvas" width="420" height="500"></canvas>
  </div>

  <div id="message" class="msg-hint">클릭 또는 스페이스바로 시작</div>
  <div class="controls-hint">마우스로 패들 조종 &nbsp;|&nbsp; 모바일: 터치로 조종</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const stageEl = document.getElementById('stage');
  const msgEl   = document.getElementById('message');

  // 벽돌 행·열
  const BCOLS = 8, BROWS = 5;
  const BW = 44, BH = 18, BGAPX = 6, BGAPY = 5;
  const BOFFX = (W - (BCOLS * (BW + BGAPX) - BGAPX)) / 2;
  const BOFFY = 50;

  const BRICK_COLORS = [
    ['#e94560','#ff6b8a'], ['#ff8a65','#ffb08a'],
    ['#ffd54f','#ffe07a'], ['#81c784','#a5d6a7'],
    ['#4dd0e1','#80deea'],
  ];

  let paddle, ball, bricks, score, lives, stage, running, started, raf;
  let mouseX = W / 2;

  function initBricks() {
    bricks = [];
    for (let r = 0; r < BROWS; r++)
      for (let c = 0; c < BCOLS; c++) {
        const x = BOFFX + c * (BW + BGAPX);
        const y = BOFFY + r * (BH + BGAPY);
        bricks.push({ x, y, alive: true, row: r });
      }
  }

  function ballSpeedForStage(s) { return 3.5 + s * 0.4; }

  function resetBall() {
    ball = { x: W / 2, y: H - 100, r: 7 };
    const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.8;
    const sp = ballSpeedForStage(stage);
    ball.vx = Math.cos(angle) * sp;
    ball.vy = Math.sin(angle) * sp;
  }

  function initStage() {
    paddle = { w: 80, h: 12, y: H - 30, x: W / 2 - 40 };
    resetBall();
    initBricks();
    started = false;
  }

  function newGame() {
    score = 0; lives = 3; stage = 1;
    scoreEl.textContent = 0;
    livesEl.textContent = '❤️'.repeat(lives);
    stageEl.textContent = 1;
    msgEl.textContent = '클릭 또는 스페이스바로 시작';
    msgEl.className = 'msg-hint';
    running = false;
    initStage();
    draw();
  }

  function startRound() {
    started = true; running = true;
    msgEl.textContent = '';
    if (!raf) loop();
  }

  function loop() {
    raf = requestAnimationFrame(loop);
    update();
    draw();
  }

  function update() {
    if (!running || !started) return;

    // paddle follows mouse/touch
    paddle.x = Math.max(0, Math.min(W - paddle.w, mouseX - paddle.w / 2));

    // ball move
    ball.x += ball.vx; ball.y += ball.vy;

    // wall bounce
    if (ball.x - ball.r < 0)  { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W)  { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < 0)  { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    // ball lost
    if (ball.y - ball.r > H) {
      lives--;
      livesEl.textContent = lives > 0 ? '❤️'.repeat(lives) : '💀';
      if (lives <= 0) { gameOver(); return; }
      running = false; started = false;
      initStage();
      msgEl.textContent = `남은 라이프: ${'❤️'.repeat(lives)} — 클릭으로 계속`;
      msgEl.className = 'msg-hint';
      draw();
      return;
    }

    // paddle collision
    if (ball.vy > 0 &&
        ball.x > paddle.x && ball.x < paddle.x + paddle.w &&
        ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + Math.abs(ball.vy)) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      const angle = hit * 1.1;
      const sp = ballSpeedForStage(stage);
      ball.vx = Math.sin(angle) * sp;
      ball.vy = -Math.cos(angle) * sp;
      ball.y = paddle.y - ball.r;
    }

    // brick collision
    let allDead = true;
    for (const b of bricks) {
      if (!b.alive) continue;
      allDead = false;
      if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + BW &&
          ball.y + ball.r > b.y && ball.y - ball.r < b.y + BH) {
        b.alive = false;
        score += (BROWS - b.row) * 10;
        scoreEl.textContent = score;
        // bounce direction
        const overlapX = Math.min(ball.x + ball.r - b.x, b.x + BW - (ball.x - ball.r));
        const overlapY = Math.min(ball.y + ball.r - b.y, b.y + BH - (ball.y - ball.r));
        if (overlapX < overlapY) ball.vx = -ball.vx;
        else                     ball.vy = -ball.vy;
        break;
      }
    }

    if (allDead) nextStage();
  }

  function nextStage() {
    stage++;
    stageEl.textContent = stage;
    running = false;
    initStage();
    msgEl.textContent = `🎉 스테이지 ${stage}! 클릭으로 계속`;
    msgEl.className = 'msg-win';
    draw();
  }

  function gameOver() {
    running = false; started = false;
    cancelAnimationFrame(raf); raf = null;
    msgEl.textContent = '💀 게임 오버! 클릭으로 재시작';
    msgEl.className = 'msg-over';
  }

  function draw() {
    // bg
    ctx.fillStyle = '#0d1b33';
    ctx.fillRect(0, 0, W, H);

    // bricks
    bricks.forEach(b => {
      if (!b.alive) return;
      const [col, hi] = BRICK_COLORS[b.row % BRICK_COLORS.length];
      ctx.save();
      ctx.shadowColor = col; ctx.shadowBlur = 6;
      ctx.fillStyle = col;
      roundRect(ctx, b.x, b.y, BW, BH, 5);
      ctx.fillStyle = hi + '55';
      ctx.fillRect(b.x + 3, b.y + 2, BW - 6, 4);
      ctx.restore();
    });

    // paddle
    ctx.save();
    ctx.shadowColor = '#ce93d8'; ctx.shadowBlur = 12;
    ctx.fillStyle = '#ce93d8';
    roundRect(ctx, paddle.x, paddle.y, paddle.w, paddle.h, 6);
    ctx.restore();

    // ball
    ctx.save();
    ctx.shadowColor = '#fff'; ctx.shadowBlur = 14;
    const grad = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 1, ball.x, ball.y, ball.r);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(1, '#ce93d8');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // launch hint
    if (!started && lives > 0) {
      ctx.fillStyle = '#ffffff22';
      ctx.font = '13px Segoe UI'; ctx.textAlign = 'center';
      ctx.fillText('클릭으로 발사!', W / 2, H / 2);
    }
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath(); ctx.fill();
  }

  // 마우스
  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
  });
  canvas.addEventListener('click', () => {
    if (!running && lives <= 0) { newGame(); return; }
    if (!started) startRound();
  });

  // 터치
  canvas.addEventListener('touchmove', e => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.touches[0].clientX - rect.left;
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchstart', e => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.touches[0].clientX - rect.left;
    if (!started) startRound();
    e.preventDefault();
  }, { passive: false });

  // 키보드
  document.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') {
      if (!running && lives <= 0) { newGame(); return; }
      if (!started) startRound();
    }
    if (e.key === 'ArrowLeft')  mouseX = Math.max(0, mouseX - 18);
    if (e.key === 'ArrowRight') mouseX = Math.min(W, mouseX + 18);
    e.preventDefault();
  });

  newGame();
</script>
</body>
</html>

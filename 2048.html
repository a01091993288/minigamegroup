<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔢 2048</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a2e;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e0e0e0;
      user-select: none;
    }
    .home-btn {
      position: fixed; top: 1rem; left: 1rem;
      padding: 0.4rem 1rem;
      border: 1.5px solid #7a8ba0; border-radius: 20px;
      color: #7a8ba0; text-decoration: none;
      font-size: 0.8rem; transition: all 0.2s;
    }
    .home-btn:hover { border-color: #ffd54f; color: #ffd54f; }

    h1 { font-size: 1.8rem; margin-bottom: 0.8rem; color: #ffd54f; letter-spacing: 3px; text-shadow: 0 0 20px #ffd54f66; }

    #status-bar {
      display: flex; gap: 1rem; margin-bottom: 0.8rem; align-items: center;
    }
    .stat {
      display: flex; flex-direction: column; align-items: center;
      background: #16213e; border: 1px solid #0f3460;
      border-radius: 10px; padding: 0.4rem 1.2rem; min-width: 70px;
    }
    .stat-label { font-size: 0.62rem; color: #7a8ba0; letter-spacing: 2px; text-transform: uppercase; }
    .stat-value { font-size: 1.4rem; font-weight: bold; color: #ffd54f; font-variant-numeric: tabular-nums; }

    .btn {
      padding: 0.4rem 1rem;
      background: transparent; border: 1.5px solid #ffd54f;
      border-radius: 20px; color: #ffd54f;
      font-size: 0.82rem; cursor: pointer; transition: all 0.2s;
    }
    .btn:hover { background: #ffd54f; color: #1a1a2e; }

    #board-wrap {
      padding: 10px;
      background: #16213e; border: 2px solid #0f3460;
      border-radius: 14px;
      box-shadow: 0 0 40px #ffd54f22;
    }
    #board {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 8px; background: #0a1628;
      padding: 8px; border-radius: 8px;
      width: 340px;
    }
    .tile {
      width: 75px; height: 75px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 10px;
      font-weight: 900; font-size: 1.5rem;
      transition: transform 0.1s;
      animation: pop 0.12s ease;
    }
    @keyframes pop { 0%{transform:scale(0.8)} 60%{transform:scale(1.08)} 100%{transform:scale(1)} }
    .tile-0    { background: #0f2040; color: transparent; }
    .tile-2    { background: #e0c090; color: #5a4020; font-size: 1.6rem; }
    .tile-4    { background: #e0b870; color: #4a3010; font-size: 1.6rem; }
    .tile-8    { background: #f09050; color: #fff; }
    .tile-16   { background: #f07040; color: #fff; }
    .tile-32   { background: #f05050; color: #fff; }
    .tile-64   { background: #e03030; color: #fff; }
    .tile-128  { background: #e0c840; color: #fff; font-size: 1.25rem; }
    .tile-256  { background: #e0c030; color: #fff; font-size: 1.25rem; }
    .tile-512  { background: #e0b820; color: #fff; font-size: 1.25rem; }
    .tile-1024 { background: #e0a010; color: #fff; font-size: 1rem; }
    .tile-2048 { background: #ffd54f; color: #1a1a2e; font-size: 1rem; box-shadow: 0 0 20px #ffd54f88; }
    .tile-super{ background: #a070e0; color: #fff; font-size: 0.85rem; box-shadow: 0 0 20px #a070e066; }

    #message {
      margin-top: 0.8rem; font-size: 1rem; min-height: 1.5rem;
      letter-spacing: 1px; text-align: center;
    }
    .msg-win  { color: #ffd54f; }
    .msg-over { color: #e94560; }
    .msg-hint { color: #7a8ba0; font-size: 0.8rem; }

    .controls-hint { margin-top: 0.6rem; font-size: 0.75rem; color: #7a8ba0; }
  </style>
</head>
<body>
  <a class="home-btn" href="index.html">← 홈</a>
  <h1>🔢 2048</h1>

  <div id="status-bar">
    <div class="stat"><span class="stat-label">점수</span><span class="stat-value" id="score">0</span></div>
    <div class="stat"><span class="stat-label">최고</span><span class="stat-value" id="best">0</span></div>
    <button class="btn" onclick="newGame()">새 게임</button>
  </div>

  <div id="board-wrap">
    <div id="board"></div>
  </div>

  <div id="message" class="msg-hint">방향키로 타일을 밀어 2048을 만드세요!</div>
  <div class="controls-hint">↑ ↓ ← → 방향키 &nbsp;|&nbsp; 모바일: 스와이프</div>

<script>
  const SIZE = 4;
  let grid, score, won, over;
  let touchStartX, touchStartY;

  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');
  const msgEl   = document.getElementById('message');
  const boardEl = document.getElementById('board');

  function getBest() { return parseInt(localStorage.getItem('2048_best') || '0'); }
  function saveBest(s) { if (s > getBest()) localStorage.setItem('2048_best', s); }

  function newGrid() {
    return Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  }

  function addTile(g) {
    const empty = [];
    g.forEach((row, r) => row.forEach((v, c) => { if (!v) empty.push([r, c]); }));
    if (!empty.length) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    g[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function newGame() {
    grid = newGrid(); score = 0; won = false; over = false;
    addTile(grid); addTile(grid);
    scoreEl.textContent = 0;
    bestEl.textContent = getBest();
    msgEl.textContent = '방향키로 타일을 밀어 2048을 만드세요!';
    msgEl.className = 'msg-hint';
    render();
  }

  function slideRow(row) {
    let arr = row.filter(v => v);
    let gained = 0;
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] === arr[i + 1]) {
        arr[i] *= 2; gained += arr[i]; arr.splice(i + 1, 1); i++;
      }
    }
    while (arr.length < SIZE) arr.push(0);
    return { row: arr, gained };
  }

  function move(dir) {
    if (over) return;
    let moved = false;
    let gained = 0;
    const g = grid.map(r => [...r]);

    const rotate = m => m[0].map((_, c) => m.map(r => r[c]).reverse());
    const rotateBack = m => m[0].map((_, c) => m.map(r => r[c])).map(r => r.reverse());

    let m = g;
    if (dir === 'up')    m = rotate(g);
    if (dir === 'down')  m = rotateBack(g);
    if (dir === 'right') m = g.map(r => [...r].reverse());

    const next = m.map(row => {
      const res = slideRow(row);
      gained += res.gained;
      if (res.row.some((v, i) => v !== row[i])) moved = true;
      return res.row;
    });

    let result = next;
    if (dir === 'up')    result = rotateBack(next);
    if (dir === 'down')  result = rotate(next);
    if (dir === 'right') result = next.map(r => [...r].reverse());

    if (!moved && gained === 0) {
      // check if any move was actually made
      const same = result.every((row, r) => row.every((v, c) => v === grid[r][c]));
      if (same) return;
    }

    grid = result;
    score += gained;
    scoreEl.textContent = score;
    saveBest(score);
    bestEl.textContent = getBest();

    if (!won && grid.flat().includes(2048)) {
      won = true;
      msgEl.textContent = '🎉 2048 달성! 계속 진행하세요!';
      msgEl.className = 'msg-win';
    }

    addTile(grid);

    if (!canMove()) {
      over = true;
      msgEl.textContent = '😵 더 이상 움직일 수 없습니다!';
      msgEl.className = 'msg-over';
    }

    render();
  }

  function canMove() {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        if (!grid[r][c]) return true;
        if (r < SIZE - 1 && grid[r][c] === grid[r+1][c]) return true;
        if (c < SIZE - 1 && grid[r][c] === grid[r][c+1]) return true;
      }
    return false;
  }

  function tileClass(v) {
    if (!v) return 'tile tile-0';
    if (v <= 2048) return `tile tile-${v}`;
    return 'tile tile-super';
  }

  function render() {
    boardEl.innerHTML = '';
    grid.forEach(row => {
      row.forEach(val => {
        const div = document.createElement('div');
        div.className = tileClass(val);
        div.textContent = val || '';
        boardEl.appendChild(div);
      });
    });
  }

  document.addEventListener('keydown', e => {
    const map = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
                  w:'up', s:'down', a:'left', d:'right' };
    if (map[e.key]) { move(map[e.key]); e.preventDefault(); }
  });

  document.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  document.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else                              move(dy > 0 ? 'down'  : 'up');
  }, { passive: true });

  newGame();
</script>
</body>
</html>
